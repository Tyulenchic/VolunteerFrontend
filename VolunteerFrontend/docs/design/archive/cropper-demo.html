<style>
  :root {
    color-scheme: light;
    --bg: #f3f6fc; --surface: #ffffff; --fg: #0f1b33; --head: #0a2438;
    --muted: #4a5873; --faint: #5e6a82; --quiet: #7b879d;
    --line: #e2e8f2; --rule: #cbd5e4;
    --accent: #2563eb; --accent-fg: #fff; --accent-soft: #eaf1ff;
    --green: #10b981; --green-soft: #e1f6ee; --warn: #d92d20; --warn-soft: #fdecea;
    --font-display: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  html { font-size: 15px; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  .font-display { font-family: var(--font-display); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .on-dark :focus-visible { outline-color: #fff; }
  /* затемнение вне рамки + сетка третей внутри */
  .crop-frame {
    box-shadow: 0 0 0 9999px rgba(10, 20, 39, .62);
    background-image:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.55) calc(33.33% - .5px), rgba(255,255,255,.55) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.55) calc(66.66% - .5px), rgba(255,255,255,.55) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.55) calc(33.33% - .5px), rgba(255,255,255,.55) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.55) calc(66.66% - .5px), rgba(255,255,255,.55) calc(66.66% + .5px), transparent calc(66.66% + .5px));
  }
  .crop-frame:focus-visible { outline: 3px solid #fff; outline-offset: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  /* ================================================================
     НАЗНАЧЕНИЯ ФОТО.
     aspect  — пропорции области показа

     outputs — ширины производных, которые делает бэкенд
     round   — рамка показывается кругом (аватар)
     ================================================================ */
  const PRESETS = {
    avatar: { label: 'Аватар',      aspect: 1,       min: [184, 184],   outputs: [184, 64, 32],        round: true,
              note: 'Фото профиля: шапка, карточка волонтёра, комментарии' },
    news:   { label: 'Новость',     aspect: 16 / 10, min: [1200, 750],  outputs: [1600, 1200, 800, 400], round: false,
              note: 'Обложка новости в списке и на главной' },
    event:  { label: 'Мероприятие', aspect: 16 / 10, min: [1200, 750],  outputs: [1600, 1200, 800, 400], round: false,
              note: 'Фото на карточке мероприятия' }
  };
  const MAX_BYTES = 10 * 1024 * 1024;
  const ACCEPT = ['image/jpeg', 'image/png', 'image/webp'];
  const MIN_FRAME = .08;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const fmt = n => Math.round(n).toLocaleString('ru-RU');
  const mb = n => (n / 1024 / 1024).toFixed(1).replace('.', ',');

  /* область по умолчанию: максимальный прямоугольник нужных пропорций, по центру */
  function defaultRect(nw, nh, aspect, focusY = .5) {
    const hr = nw / (aspect * nh);
    let w = 1, h = hr;
    if (h > 1) { h = 1; w = 1 / hr; }
    return { x: (1 - w) / 2, y: (1 - h) * focusY, w, h };
  }

  const ICONS = {

  /* ================================================================
     CROPPER — рамка выбора области.
     Значение наружу: { x, y, w, h } в долях 0..1 от размеров ОРИГИНАЛА.
     Поддержка: мышь, палец (pointer events), клавиатура.
     ================================================================ */
  function Cropper({ src, nw, nh, aspect, rect, onChange, round }) {
    const wrap = useRef(null);
    const drag = useRef(null);
    const hr = nw / (aspect * nh);            // высота рамки относительно её ширины, в долях картинки
    const maxW = Math.min(1, 1 / hr);         // рамка не может вылезти за картинку

    const start = (mode, ev) => {
      ev.preventDefault(); ev.stopPropagation();
      drag.current = { mode, b: wrap.current.getBoundingClientRect(), rect: { ...rect }, px: ev.clientX, py: ev.clientY };
      ev.currentTarget.setPointerCapture(ev.pointerId);
    };
    const move = ev => {
      const d = drag.current; if (!d) return;
      if (d.mode === 'move') {
        const dx = (ev.clientX - d.px) / d.b.width, dy = (ev.clientY - d.py) / d.b.height;
        onChange({ ...d.rect, x: clamp(d.rect.x + dx, 0, 1 - d.rect.w), y: clamp(d.rect.y + dy, 0, 1 - d.rect.h) });
        return;
      }
      const left = d.mode[1] === 'w', top = d.mode[0] === 'n';
      const ax = left ? d.rect.x + d.rect.w : d.rect.x;   // противоположный угол стоит на месте
      const ay = top ? d.rect.y + d.rect.h : d.rect.y;
      const px = clamp((ev.clientX - d.b.left) / d.b.width, 0, 1);
      const py = clamp((ev.clientY - d.b.top) / d.b.height, 0, 1);
      const sx = left ? -1 : 1, sy = top ? -1 : 1;
      let w = Math.max((px - ax) * sx, ((py - ay) * sy) / hr);
      w = clamp(w, MIN_FRAME, Math.min(left ? ax : 1 - ax, (top ? ay : 1 - ay) / hr));
      const h = w * hr;
      onChange({ x: left ? ax - w : ax, y: top ? ay - h : ay, w, h });
    };
    const end = () => { drag.current = null; };

    /* клавиатура: стрелки двигают, +/- меняют размер, Shift — крупный шаг */
    const onKey = ev => {
      const step = ev.shiftKey ? .08 : .02;
      let r = { ...rect }, used = true;
      if (ev.key === 'ArrowLeft') r.x = clamp(r.x - step, 0, 1 - r.w);
      else if (ev.key === 'ArrowRight') r.x = clamp(r.x + step, 0, 1 - r.w);
      else if (ev.key === 'ArrowUp') r.y = clamp(r.y - step, 0, 1 - r.h);
      else if (ev.key === 'ArrowDown') r.y = clamp(r.y + step, 0, 1 - r.h);
      else if (ev.key === '+' || ev.key === '=') r = scale(rect, step, hr, maxW);
      else if (ev.key === '-' || ev.key === '_') r = scale(rect, -step, hr, maxW);
      else used = false;
      if (used) { ev.preventDefault(); onChange(r); }

        onPointerDown=${ev => start(mode, ev)} onPointerMove=${move} onPointerUp=${end} onPointerCancel=${end}
        className=${`absolute z-10 h-5 w-5 rounded-[5px] border-2 border-accent bg-white shadow-sm ${pos}`}
        style=${{ touchAction: 'none', cursor }}></span>`;

      <div ref=${wrap} className="relative inline-block max-w-full select-none align-top" style=${{ touchAction: 'none' }}>
        <img src=${src} alt="Загруженное фото целиком" draggable="false" className="block max-h-[52vh] max-w-full rounded-lg" />
        <div tabIndex="0" role="application"
          aria-label="Область показа. Стрелки — переместить, плюс и минус — изменить размер"
          onKeyDown=${onKey}
          onPointerDown=${ev => start('move', ev)} onPointerMove=${move} onPointerUp=${end} onPointerCancel=${end}
          className=${`crop-frame absolute cursor-move ${round ? 'rounded-full' : 'rounded-[2px]'}`}
          style=${{ left: rect.x * 100 + '%', top: rect.y * 100 + '%', width: rect.w * 100 + '%', height: rect.h * 100 + '%', touchAction: 'none', outline: '2px solid #fff' }}>
          ${corner('nw', '-left-2 -top-2', 'nwse-resize')}
          ${corner('ne', '-right-2 -top-2', 'nesw-resize')}
          ${corner('sw', '-bottom-2 -left-2', 'nesw-resize')}
          ${corner('se', '-bottom-2 -right-2', 'nwse-resize')}
        </div>
      </div>`;
  }
  function scale(rect, delta, hr, maxW) {
    const w = clamp(rect.w + delta, MIN_FRAME, maxW), h = w * hr;
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    return { x: clamp(cx - w / 2, 0, 1 - w), y: clamp(cy - h / 2, 0, 1 - h), w, h };
  }

  /* ================================================================
     PREVIEW — то же, что увидит посетитель сайта.
     Оригинал не режется: показывается нужный кусок через смещение.
     ================================================================ */
  const CropPreview = ({ src, rect, aspect, className = '', round = false }) => html`
    <div className=${`relative overflow-hidden ${round ? 'rounded-full' : 'rounded-xl'} ${className}`} style=${{ aspectRatio: aspect }}>
      <img src=${src} alt="" draggable="false" className="absolute max-w-none select-none"
        style=${{ width: (100 / rect.w) + '%', left: -(rect.x / rect.w * 100) + '%', top: -(rect.y / rect.h * 100) + '%' }} />
    </div>`;

  /* ================================================================
     ЭКРАН
     ================================================================ */
  function App() {
    const [preset, setPreset] = useState('news');
    const [photo, setPhoto] = useState(null);   // { src, nw, nh, name, size, type }
    const [rect, setRect] = useState(null);
    const [error, setError] = useState('');
    const [over, setOver] = useState(false);
    const [saved, setSaved] = useState(false);
    const P = PRESETS[preset];

    const load = useCallback((file, src, nw, nh, key) => {
      const p = PRESETS[key];
      const [minW, minH] = p.min;
      if (nw < minW || nh < minH) {
        setError(`Фото ${fmt(nw)} × ${fmt(nh)} px слишком маленькое. Для «${p.label}» нужно минимум ${fmt(minW)} × ${fmt(minH)} px.`);
        return;
      }
      setError('');
      setPhoto({ src, nw, nh, name: file ? file.name : 'sample.jpg', size: file ? file.size : 0, type: file ? file.type : 'image/jpeg' });
      setRect(defaultRect(nw, nh, p.aspect, .35));
      setSaved(false);
    }, []);

    const readFile = useCallback((file, key) => {
      if (!file) return;
      if (!ACCEPT.includes(file.type)) { setError('Поддерживаются только JPEG, PNG и WebP.'); return; }
      if (file.size > MAX_BYTES) { setError(`Файл ${mb(file.size)} МБ больше допустимых 10 МБ.`); return; }
      const rd = new FileReader();
      rd.onerror = () => setError('Не удалось прочитать файл. Попробуйте другой.');
      rd.onload = () => {
        const im = new Image();
        im.onerror = () => setError('Файл не похож на изображение.');
        im.onload = () => load(file, rd.result, im.naturalWidth, im.naturalHeight, key);
        im.src = rd.result;
      };
      rd.readAsDataURL(file);
    }, [load]);

    /* демонстрационное фото при открытии */
    useEffect(() => {
      const im = new Image();
      im.onload = () => load(null, SAMPLE, im.naturalWidth, im.naturalHeight, 'news');
      im.src = SAMPLE;
    }, []);

    /* смена назначения: пересчитываем область под новые пропорции */
    const switchPreset = key => {
      setPreset(key); setSaved(false);
      if (!photo) return;
      const p = PRESETS[key];
      if (photo.nw < p.min[0] || photo.nh < p.min[1]) {
        setError(`Это фото ${fmt(photo.nw)} × ${fmt(photo.nh)} px. Для «${p.label}» нужно минимум ${fmt(p.min[0])} × ${fmt(p.min[1])} px — загрузите другое.`);
      } else {
        setError('');
        setRect(defaultRect(photo.nw, photo.nh, p.aspect, .35));
      }
    };

    const onDrop = ev => { ev.preventDefault(); setOver(false); readFile(ev.dataTransfer.files && ev.dataTransfer.files[0], preset); };

    /* размер выбранной области в пикселях оригинала */
    const areaW = photo && rect ? rect.w * photo.nw : 0;
    const areaH = photo && rect ? rect.h * photo.nh : 0;
    const need = P.outputs[0];
    const tooSmall = photo && rect && areaW < need;   // при показе придётся растягивать

    const payload = photo && rect ? {
      purpose: preset,
      file: { name: photo.name, type: photo.type, bytes: photo.size, width: photo.nw, height: photo.nh },
      crop: { x: +rect.x.toFixed(5), y: +rect.y.toFixed(5), w: +rect.w.toFixed(5), h: +rect.h.toFixed(5) },
      aspect: +P.aspect.toFixed(4),
      areaPx: { width: Math.round(areaW), height: Math.round(areaH) }
    } : null;

    return html`
      <div className="min-h-screen">
        <header className="border-b border-line bg-surface">
          <div className="mx-auto flex h-16 max-w-[72rem] items-center gap-3 px-4 sm:px-6">
            <span className="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-accent-soft text-accent"><${Icon} n="image" size=${18} /></span>
            <div className="min-w-0">
              <p className="font-display truncate text-[15px] font-extrabold tracking-tight text-head">Выбор области фото</p>
              <p className="truncate text-[12.5px] text-faint">Эталон поведения для внедрения в проект</p>
            </div>
          </div>
        </header>

        <main className="mx-auto max-w-[72rem] px-4 py-8 sm:px-6 sm:py-10">
          <p className="max-w-[46rem] text-[14.5px] leading-relaxed text-muted">
            Оригинал загружается и хранится целиком. Пользователь выбирает только область показа — она сохраняется
            как четыре числа в долях от оригинала. Любое место сайта берёт из этих чисел свой размер.
          </p>

          <!-- назначение -->
          <div className="mt-7">
            <p className="label text-faint">Куда загружаем</p>
            <div className="mt-3 flex flex-wrap gap-2" role="tablist" aria-label="Назначение фото">
              ${Object.keys(PRESETS).map(k => html`
                <button key=${k} type="button" role="tab" aria-selected=${k === preset} onClick=${() => switchPreset(k)}
                  className=${`inline-flex h-11 items-center gap-2 rounded-lg border-[1.5px] px-4 text-[13.5px] font-semibold ${k === preset ? 'border-accent bg-accent-soft text-accent' : 'border-rule bg-surface text-muted hover:border-accent'}`}>
                  ${PRESETS[k].label}
                  <span className="text-[11.5px] font-medium tabular-nums opacity-70">${k === 'avatar' ? '1:1' : '16:10'}</span>
                </button>`)}
            </div>
            <p className="mt-2.5 text-[13px] text-muted">${P.note}. Минимум ${fmt(P.min[0])} × ${fmt(P.min[1])} px.</p>
          </div>

          ${error && html`
            <p role="alert" className="mt-5 flex items-start gap-2.5 rounded-xl bg-warn-soft p-4 text-[13.5px] font-medium leading-relaxed text-warn">
              <span className="mt-px shrink-0"><${Icon} n="warn" size=${16} /></span>${error}
            </p>`}

          <div className="mt-6 grid gap-7 lg:grid-cols-[1.5fr_1fr] lg:gap-10">
            <!-- рамка -->
            <div className="min-w-0">
              <div onDragOver=${ev => { ev.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)} onDrop=${onDrop}
                className=${`on-dark grid min-h-[18rem] place-items-center rounded-2xl border-2 border-dashed p-3 sm:p-5 ${over ? 'border-accent bg-[#122c4e]' : 'border-transparent bg-[#0f2036]'}`}>
                ${photo && rect
                  ? html`<${Cropper} key=${preset + photo.src.slice(-16)} src=${photo.src} nw=${photo.nw} nh=${photo.nh}
                      aspect=${P.aspect} rect=${rect} onChange=${setRect} round=${P.round} />`
                  : html`<p className="px-6 text-center text-[13.5px] text-white/70">Перетащите фото сюда или нажмите «Загрузить фото»</p>`}
              </div>

              ${photo && rect && html`
                <label className="mt-5 flex items-center gap-4 text-[13px] font-medium" htmlFor="size">
                  <span className="shrink-0">Размер области</span>
                  <input id="size" type="range" min=${Math.round(MIN_FRAME * 100)} max="100" value=${Math.round(rect.w * 100)}
                    onInput=${ev => setRect(r => scale(r, ev.target.value / 100 - r.w, photo.nw / (P.aspect * photo.nh), Math.min(1, (P.aspect * photo.nh) / photo.nw)))}
                    className="w-full accent-[#2563eb]" />
                  <span className="w-12 shrink-0 text-right tabular-nums text-muted">${Math.round(rect.w * 100)}%</span>
                </label>`}

              <div className="mt-5 flex flex-wrap gap-3">
                <label className="inline-flex h-11 cursor-pointer items-center gap-2 rounded-lg bg-accent px-5 text-[14px] font-semibold text-accent-fg hover:opacity-90">
                  <${Icon} n="upload" size=${16} />Загрузить фото
                  <input type="file" accept="image/jpeg,image/png,image/webp" className="sr-only"
                    onChange=${ev => { readFile(ev.target.files && ev.target.files[0], preset); ev.target.value = ''; }} />
                </label>
                ${photo && html`
                  <button type="button" onClick=${() => { setRect(defaultRect(photo.nw, photo.nh, P.aspect, .35)); setSaved(false); }}
                    className="inline-flex h-11 items-center gap-2 rounded-lg border-[1.5px] border-rule bg-surface px-5 text-[14px] font-semibold hover:border-accent hover:text-accent">
                    <${Icon} n="reset" size=${16} />Сбросить область
                  </button>`}
              </div>
              <p className="mt-3 text-[12.5px] leading-relaxed text-faint">
                Рамку можно тянуть мышью или пальцем, углы меняют размер. С клавиатуры: Tab до рамки, стрелки двигают, плюс и минус меняют размер.
              </p>
            </div>

            <!-- предпросмотр -->
            <div className="min-w-0">
              <p className="label text-faint">Как это увидят на сайте</p>
              ${photo && rect ? html`
                <${React.Fragment}>
                  ${P.round
                    ? html`
                      <div className="mt-3 flex flex-wrap items-end gap-6 rounded-2xl border border-line bg-surface p-5">
                        ${P.outputs.map(sz => html`
                          <div key=${sz} className="flex flex-col items-center gap-2">
                            <div style=${{ width: Math.min(sz, 112) + 'px' }}>
                              <${CropPreview} src=${photo.src} rect=${rect} aspect=${1} round=${true} className="w-full ring-1 ring-line" />
                            </div>
                            <span className="text-[11.5px] tabular-nums text-faint">${sz} px</span>
                          </div>`)}
                      </div>`
                    : html`
                      <div className="mt-3 overflow-hidden rounded-2xl border border-line bg-surface p-3">
                        <${CropPreview} src=${photo.src} rect=${rect} aspect=${P.aspect} className="w-full" />
                      </div>`}

                  <dl className="mt-5 grid grid-cols-[auto_1fr] gap-x-5 gap-y-1.5 text-[13px]">
                    <dt className="text-muted">Оригинал</dt><dd className="tabular-nums font-medium">${fmt(photo.nw)} × ${fmt(photo.nh)} px</dd>
                    <dt className="text-muted">Область показа</dt><dd className="tabular-nums font-medium">${fmt(areaW)} × ${fmt(areaH)} px</dd>
                    <dt className="text-muted">Пропорции</dt><dd className="tabular-nums font-medium">${preset === 'avatar' ? '1:1' : '16:10'}</dd>
                    <dt className="text-muted">Сделает бэкенд</dt><dd className="tabular-nums font-medium">${P.outputs.join(', ')} px</dd>
                  </dl>

                  ${tooSmall
                    ? html`<p className="mt-4 flex items-start gap-2.5 rounded-xl bg-warn-soft p-3.5 text-[12.5px] font-medium leading-relaxed text-warn">
                        <span className="mt-px shrink-0"><${Icon} n="warn" size=${15} /></span>
                        Выбрано ${fmt(areaW)} px по ширине, а для показа нужно ${fmt(need)} px. Фото будет растянуто и станет мягким — увеличьте область.
                      </p>`
                    : html`<p className="mt-4 flex items-start gap-2.5 rounded-xl bg-green-soft p-3.5 text-[12.5px] font-medium leading-relaxed text-fg">
                        <span className="mt-px shrink-0 text-green"><${Icon} n="check" size=${15} /></span>
                        Качества хватает: область шире, чем нужно для самого большого размера.
                      </p>`}

                  <button type="button" onClick=${() => setSaved(true)}
                    className="mt-5 inline-flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-accent px-5 text-[14px] font-semibold text-accent-fg hover:opacity-90">
                    <${Icon} n="check" size=${16} />Сохранить
                  </button>

                  ${saved && html`
                    <div className="mt-5" role="status">
                      <p className="label text-faint">Уходит на сервер</p>
                      <pre className="mt-2 overflow-x-auto rounded-xl bg-[#0f2036] p-4 text-[12px] leading-relaxed text-white"><code>${JSON.stringify(payload, null, 2)}</code></pre>
                      <p className="mt-2.5 text-[12.5px] leading-relaxed text-faint">
                        Файл уходит один раз как оригинал. Дальше меняется только область — это четыре числа, перезагружать фото не нужно.
                      </p>
                    </div>`}
                <//>`
                : html`<p className="mt-3 rounded-2xl border border-line bg-surface p-5 text-[13.5px] text-muted">Загрузите фото, чтобы увидеть предпросмотр.</p>`}
            </div>
          </div>
        </main>
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
